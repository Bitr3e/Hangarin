{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Confirm {{ provider.name }} Login | Hangarin</title>

  <!-- Bootstrap & Icons -->
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.css" />

  <style>
    /* 🌿 Nature-Inspired Gradient Background */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 50%, #81c784 100%);
      font-family: 'Poppins', sans-serif;
      color: #1b5e20;
      overflow: hidden;
    }

    /* 🌸 Floating leaves background effect */
    .leaf {
      position: absolute;
      width: 20px;
      height: 20px;
      background: rgba(76, 175, 80, 0.2);
      border-radius: 50%;
      animation: float 10s infinite ease-in-out;
    }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-40px) rotate(180deg);
      }

      100% {
        transform: translateY(0) rotate(360deg);
      }
    }

    /* 🌼 Main Card */
    .auth-card {
      max-width: 450px;
      width: 100%;
      background: #f9fff9;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 50, 0, 0.2);
      padding: 2.5rem;
      text-align: center;
      position: relative;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(129, 199, 132, 0.3);
      transition: all 0.3s ease-in-out;
      z-index: 1;
    }

    .auth-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 45px rgba(0, 100, 0, 0.25);
    }

    /* 🌿 Title */
    .auth-card h3 {
      color: #2e7d32;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .auth-card p {
      color: #33691e;
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    /* 🌱 Buttons */
    .btn-primary {
      background-color: #2e7d32 !important;
      border: none;
      padding: 10px 0;
      border-radius: 30px;
      font-weight: 500;
      font-size: 1.05rem;
      box-shadow: 0 3px 10px rgba(46, 125, 50, 0.4);
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #1b5e20 !important;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(27, 94, 32, 0.5);
    }

    .btn-outline-secondary {
      border: 2px solid #81c784 !important;
      color: #2e7d32 !important;
      border-radius: 30px;
      padding: 10px 0;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .btn-outline-secondary:hover {
      background-color: #c8e6c9 !important;
      color: #1b5e20 !important;
      transform: translateY(-2px);
    }

    /* 🌸 Small details */
    .logo {
      font-size: 2.5rem;
      color: #1b5e20;
      margin-bottom: 0.5rem;
      display: inline-block;
    }

    .subtext {
      font-size: 0.9rem;
      color: #4e6c50;
      margin-bottom: 2rem;
    }
  </style>
</head>

<body>
  <!-- Floating Leaves -->
  <div class="leaf" style="top:10%; left:5%; animation-delay: 0s;"></div>
  <div class="leaf" style="top:30%; left:90%; animation-delay: 2s;"></div>
  <div class="leaf" style="top:60%; left:20%; animation-delay: 4s;"></div>
  <div class="leaf" style="top:80%; left:70%; animation-delay: 6s;"></div>

  <!-- Auth Card -->
  <div class="auth-card">
    <div class="logo">🌿</div>
    <h3>Confirm Your Sign In</h3>
    <p>You are about to sign in using your <strong>{{ provider.name }}</strong> account.</p>

    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-primary btn-block mb-3">
        Continue with {{ provider.name }}
      </button>
    </form>
    <a href="{% url 'account_login' %}" class="btn btn-outline-secondary btn-block">
      Cancel
    </a>
    <p class="subtext mt-4">Hangarin — Stay Organized, Stay Grounded 🌱</p>
  </div>
</body>

</html>
