{% load socialaccount %}
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Hangarin Login</title>

  <!-- Bootstrap + MDB + FontAwesome -->
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.css" />

  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
      font-family: 'Poppins', sans-serif;
      color: #1b5e20;
    }

    .auth-card {
      max-width: 600px;
      width: 100%;
      background: #f5fbf5;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(60, 100, 60, 0.15);
      padding: 2rem;
      border: 1px solid #c8e6c9;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .auth-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(60, 100, 60, 0.25);
    }

    .nav-pills .nav-link.active {
      background-color: #43a047 !important;
      color: white !important;
      font-weight: bold;
    }

    .nav-pills .nav-link {
      color: #2e7d32 !important;
      border-radius: 10px;
    }

    .form-outline input {
      border: 1px solid #81c784;
      color: #1b5e20;
    }

    .form-outline label {
      color: #2e7d32;
    }

    .btn-primary {
      background-color: #2e7d32 !important;
      border-color: #1b5e20 !important;
    }

    .btn-primary:hover {
      background-color: #1b5e20 !important;
    }

    a {
      color: #388e3c;
      text-decoration: none;
    }

    a:hover {
      color: #1b5e20;
      text-decoration: underline;
    }

    .form-check-label {
      color: #2e7d32;
    }

    .alert-danger {
      background-color: #ffcdd2;
      color: #b71c1c;
      border: 1px solid #ef9a9a;
    }
  </style>
</head>

<body>
  <div class="auth-card">
    <!-- Navigation Tabs -->
    <ul class="nav nav-pills nav-justified mb-3" id="ex1" role="tablist">
      <li class="nav-item" role="presentation">
        <a class="nav-link active" id="tab-login" data-mdb-pill-init href="#pills-login" role="tab"
          aria-controls="pillslogin" aria-selected="true">Login</a>
      </li>
      <li class="nav-item" role="presentation">
        <a class="nav-link" id="tab-register" data-mdb-pill-init href="#pills-register" role="tab"
          aria-controls="pillsregister" aria-selected="false">Register</a>
      </li>
    </ul>

    <!-- Tab Contents -->
    <div class="tab-content">

      <!-- Login Tab -->
      <div class="tab-pane fade show active" id="pills-login" role="tabpanel" aria-labelledby="tab-login">
        <form method="post" action="{% url 'account_login' %}">
          {% csrf_token %}
          <div class="text-center mb-3">
            <p>Sign in with:</p>
            <a href="{% provider_login_url 'google' %}" class="btn btn-outline-success btn-floating mx-1">
              <i class="fab fa-google"></i>
            </a>
            <a href="{% provider_login_url 'github' %}" class="btn btn-outline-success btn-floating mx-1">
              <i class="fab fa-github"></i>
            </a>
          </div>
          <p class="text-center">or:</p>

          <!-- Username / Email -->
          <div data-mdb-input-init class="form-outline mb-4">
            <input type="text" name="login" id="id_login" class="form-control" required />
            <label class="form-label" for="id_login">Email or Username</label>
          </div>

          <!-- Password -->
          <div data-mdb-input-init class="form-outline mb-4">
            <input type="password" name="password" id="id_password" class="form-control" required />
            <label class="form-label" for="id_password">Password</label>
          </div>

          <!-- Remember / Forgot -->
          <div class="row mb-4">
            <div class="col-md-6 d-flex justify-content-center">
              <div class="form-check mb-3 mb-md-0">
                <input class="form-check-input" type="checkbox" id="loginCheck" checked />
                <label class="form-check-label" for="loginCheck"> Remember me </label>
              </div>
            </div>
            <div class="col-md-6 d-flex justify-content-center">
              <a href="{% url 'account_reset_password' %}">Forgot password?</a>
            </div>
          </div>

          {% if form.non_field_errors %}
          <div class="alert alert-danger" role="alert">
            {% for error in form.non_field_errors %}
            <p{% if forloop.last %} class="mb-0" {% endif %}>{{ error }}</p>
              {% endfor %}
          </div>
          {% endif %}

          <!-- Submit -->
          <button type="submit" class="btn btn-primary btn-block mb-4">Sign in</button>
        </form>
      </div>

      <!-- Register Tab -->
      <div class="tab-pane fade" id="pills-register" role="tabpanel" aria-labelledby="tab-register">
        <form method="post" action="{% url 'account_signup' %}">
          {% csrf_token %}
          <div class="text-center mb-3">
            <p>Sign up with:</p>
            <a href="{% provider_login_url 'google' %}" class="btn btn-outline-success btn-floating mx-1">
              <i class="fab fa-google"></i>
            </a>
            <a href="{% provider_login_url 'github' %}" class="btn btn-outline-success btn-floating mx-1">
              <i class="fab fa-github"></i>
            </a>
          </div>
          <p class="text-center">or:</p>

          <!-- Username -->
          <div data-mdb-input-init class="form-outline mb-4">
            <input type="text" name="username" id="registerUsername" class="form-control" required />
            <label class="form-label" for="registerUsername">Username</label>
          </div>

          <!-- Email -->
          <div data-mdb-input-init class="form-outline mb-4">
            <input type="email" name="email" id="registerEmail" class="form-control" required />
            <label class="form-label" for="registerEmail">Email</label>
          </div>

          <!-- Password -->
          <div data-mdb-input-init class="form-outline mb-4">
            <input type="password" name="password1" id="registerPassword" class="form-control" required />
            <label class="form-label" for="registerPassword">Password</label>
          </div>

          <!-- Confirm Password -->
          <div data-mdb-input-init class="form-outline mb-4">
            <input type="password" name="password2" id="registerRepeatPassword" class="form-control" required />
            <label class="form-label" for="registerRepeatPassword">Repeat password</label>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-primary btn-block mb-3">Register</button>
        </form>
      </div>
    </div>
  </div>

  <!-- MDB JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.js"></script>
</body>

</html>
