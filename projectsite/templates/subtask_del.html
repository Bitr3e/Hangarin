{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="content">
  <div class="container-fluid">
    <h4 class="page-title">Home</h4>

    <div class="row">
      <div class="col-md-12">
        <div class="card">

          <div class="card-header">
            <div class="card-title">Delete SubTAsk</div>
            <div class="card-category">Page Subtitle</div>
          </div>

          <div class="card-body col-md-6">
            <form action="" method="post" novalidate>
              {% csrf_token %}
              <p>Are you sure you want to delete "<strong>{{ object }}</strong>"?</p>

              <div class="form-group mt-3">
                <div class="col-md-12">
                  <button type="submit" class="btn btn-danger btn-rounded me-2">
                    Yes, Delete
                  </button>
                  <a href="{% url 'subtask-list' %}" class="btn btn-secondary btn-rounded">
                    Cancel
                  </a>
                </div>
              </div>
            </form>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
