{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="content" style="background: linear-gradient(135deg, #e8f5e9, #f1f8e9); min-height: 100vh;">
  <div class="container-fluid">
    <h3 >
      <i class="la la-tags mr-2"></i>  Category
    </h3>

    <br />
    <div class="row mb-3 align-items-center">
      <!-- Search -->
      <div class="col-md-6">
        <form class="navbar-left navbar-form nav-search" action="{% url 'category-list' %}">
          <div class="input-group shadow-sm rounded" style="border: 1px solid #a5d6a7;">
            <input
              type="text"
              placeholder="Search ..."
              class="form-control"
              name="q"
              style="background: #f9fbe7; color: #1b5e20;"
            />
            <div class="input-group-append">
              <span class="input-group-text bg-success text-white">
                <i class="la la-search search-icon"></i>
              </span>
            </div>
          </div>
        </form>
      </div>

      <!-- Add Button -->
      <div class="col-md-6 text-right">
        <a href="{% url 'category-add' %}" class="btn btn-success btn-rounded shadow-sm">
          ➕ Add Category
        </a>
      </div>
    </div>

    <!-- Sort Section -->
    <div class="col-md-12 mb-4">
      <form method="get" class="row g-2 align-items-center">
        <div class="col-auto">
          <label for="smallSelect" class="col-form-label text-success font-weight-bold">Sort by</label>
        </div>

        <div class="col-auto">
          <select
            class="form-control form-control-sm shadow-sm"
            id="smallSelect"
            name="sort_by"
            style="background: #f1f8e9; color: #2e7d32; border: 1px solid #a5d6a7;"
          >
            <option value="name" {% if request.GET.sort_by == "name" %}selected{% endif %}>
              Name
            </option>
          </select>
        </div>

        <div class="col-auto">
          <button
            type="submit"
            class="btn btn-primary btn-sm btn-rounded shadow-sm"
            style="background: #388e3c; border: none;"
          >
            Sort
          </button>
        </div>
      </form>
    </div>

    <!-- Category Table -->
    <div class="row">
      <div class="col-md-12">
        <div class="card border-0 shadow-sm" style="background: #f1f8e9;">
          <div class="card-header border-0" style="background: #5daf3d; color: white;">
            <div class="card-title mb-0"><i class="la la-tags mr-2"></i> Category</div>
            <div class="card-category text-light">Enter your category here</div>
          </div>

          <div class="card-body" style="color: #1b5e20;">
            <table class="table table-hover mt-3">
              <thead style="background: #a5d6a7; color: #1b5e20;">
                <tr>
                  <th>Name</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {% for object in object_list %}
                <tr style="background: #f9fbe7;">
                  <td class="font-weight-bold">{{ object.name }}</td>
                  <td>
                    <a href="category_list/{{ object.id }}" class="text-primary">Edit</a>
                    <a href="category_list/{{ object.id }}/delete" class="text-danger ml-2">Delete</a>
                  </td>
                </tr>
                {% empty %}
                <tr>
                  <td colspan="5" class="text-center text-muted">
                    No category found.
                  </td>
                </tr>
                {% endfor %}
              </tbody>
            </table>

            {% include 'includes/pagination.html' %}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
