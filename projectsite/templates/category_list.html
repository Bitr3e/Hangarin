{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="content">
  <div class="container-fluid">
    <h4 class="page-title">Category</h4>

    <br />
    <div class="col-md-12 row">
        <div class="col-md-6">
            <form class="navbar-left navbar-form nav-search mr-md-3" action="{% url 'category-list' %}">
                <div class="input-group">
                    <input type="text" placeholder="Search ..." class="form-control" name="q" />
                    <div class="input-group-append">
                        <span class="input-group-text">
                            <i class="la la-search search-icon"></i>
                        </span>
                    </div>
                </div>
            </form>
        </div>
        <div class="col-md-15">
            <div class="pull-right">
                <a href="{% url 'category-add' %}" class="btn btn-success btn-rounded">
                    Add Category
                </a>
            </div>
        </div>
    </div>
    <div class="col-md-12">
  <form method="get" class="row g-2 align-items-center">
    <div class="col-auto">
      <label for="smallSelect" class="col-form-label">Sort by</label>
    </div>

    <div class="col-auto">
      <select class="form-control form-control-sm" id="smallSelect" name="sort_by">
        <option value="name" 
          {% if request.GET.sort_by == "name" %}selected{% endif %}>
          Name
        </option>
      </select>
    </div>

    <div class="col-auto">
      <button type="submit" class="btn btn-primary btn-sm btn-rounded">
        Sort
      </button>
    </div>
  </form>
</div>
<br>
    <div class="row">
      <div class="col-md-12">
        <div class="card">

          <div class="card-header">
            <div class="card-title">Category</div>
            <div class="card-category">Enter your Category here</div>
          </div>
          <div class="card-body">
            <table class="table table-striped mt-3">
        <thead>
            <tr>
                <th>Name</th>
            </tr>
        </thead>
        <tbody>
            {% for object in object_list %}
            <tr>
                <td>{{ object.name }}</td>
                <td>
                    <a href="category_list/{{ object.id }}">Edit</a>
                    <a href="category_list/{{ object.id }}/delete" class="text-danger">Delete</a>
                </td>

            </tr>
                {% empty %}
                  <tr>
                    <td colspan="5" class="text-center text-muted">
                      No priority found.
                    </td>
                  </tr>
                {% endfor %}
              </tbody>
            </table>

            {% include 'includes/pagination.html' %}
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
