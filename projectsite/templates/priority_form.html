{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="content">
  <div class="container-fluid">

    <div class="row">
      <div class="col-md-12">
        <div class="card">

          <div class="card-header">
            <div class="card-title">
              {% if object %}
                Update Priority
              {% else %}
                Add New Priority
              {% endif %}
            </div>
            <div class="card-category">Page Subtitle</div>
          </div>

          <div class="card-body col-md-6">
            <form action="" method="post" novalidate>
              {% csrf_token %}
              {% include 'includes/form.html' %}

              <div class="form-group mt-3">
                <div class="col-md-12">
                  <button type="submit" class="btn btn-primary btn-rounded">
                    Submit
                  </button>
                  <a href="{% url 'priority-list' %}" class="btn btn-secondary btn-rounded ms-2">
                    Cancel
                  </a>
                </div>
              </div>
            </form>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
